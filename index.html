<title>Casino Sorríos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Limelight&family=Manrope:wght@400;600;700;800&display=swap">
<style>
/* Layout: barra superior fija con saldo y nivel; vestíbulo en rejilla de mesas; cada juego ocupa el escenario central sobre tapete verde. Estética art déco nocturna, tema oscuro único a propósito. */
:root{
  --felt:#0e3a2c; --felt-2:#0a2b21; --night:#070f0d; --gold:#d9b45b; --gold-2:#f2d78c;
  --wine:#7d1f2c; --ivory:#f4ecd8; --muted:#a9b8ad; --line:rgba(217,180,91,.28);
  --red:#b8232f; --black:#151515; --blue:#2a5db0; --green:#1f8a4c;
  --f-display:'Limelight','Didot','Bodoni 72',Georgia,serif;
  --f-body:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--night)}
body{
  color:var(--ivory);font-family:var(--f-body);font-size:15px;line-height:1.45;
  background:radial-gradient(1200px 700px at 50% -10%,#173f33 0,var(--night) 70%) fixed,var(--night);
  min-height:100vh;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 40px;-webkit-tap-highlight-color:transparent;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#081411}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--gold-2);outline-offset:2px}
button:disabled{opacity:.4;cursor:not-allowed}
.num{font-variant-numeric:tabular-nums}

/* Barra superior */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px))) calc(-1*max(16px,env(safe-area-inset-right,0px)));
  padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(#081411f2,#081411e0);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:1100px;margin:auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-family:var(--f-display);font-size:22px;color:var(--gold-2);letter-spacing:.02em;line-height:1;cursor:pointer;white-space:nowrap}
.logo small{display:block;font-family:var(--f-body);font-size:9px;letter-spacing:.35em;color:var(--muted);text-transform:uppercase;margin-top:3px}
.spacer{flex:1}
.bal{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border:1px solid var(--line);border-radius:999px;background:#0006}
.bal .ico{width:26px;height:26px;border-radius:50%;background:repeating-conic-gradient(var(--gold) 0 20deg,#7a5a17 20deg 40deg);box-shadow:inset 0 0 0 5px var(--gold),inset 0 0 0 6px #0005}
.bal b{font-size:17px;color:var(--gold-2)}
.lvl{display:flex;flex-direction:column;gap:3px;min-width:120px;cursor:pointer}
.lvl .t{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.lvl .t b{color:var(--gold-2)}
.bar{height:6px;border-radius:9px;background:#ffffff14;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--gold-2));transition:width .5s}
.tb{padding:8px 12px;border-radius:999px;border:1px solid var(--line);font-size:13px;font-weight:700;position:relative;white-space:nowrap}
.tb:hover{background:#ffffff0d}
.tb .dot{position:absolute;top:2px;right:2px;width:9px;height:9px;border-radius:50%;background:#ff4d5e;box-shadow:0 0 8px #ff4d5e}
@media (max-width:620px){.lvl{order:5;flex-basis:100%}.logo{font-size:18px}.tb{padding:7px 10px;font-size:12px}}

.stage{max-width:1100px;margin:22px auto 0}

/* Vestíbulo */
.btn{padding:11px 18px;border-radius:12px;font-weight:800;letter-spacing:.02em;background:#ffffff10;border:1px solid #ffffff1c;transition:transform .1s,background .2s;color:var(--ivory)}
.btn:hover{background:#ffffff1a}
.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(#f2d78c,#c99a37);color:#2a1a02;border-color:#f6e2a6;box-shadow:0 6px 18px #d9b45b33}
.btn.primary:hover{filter:brightness(1.07)}
.btn.wine{background:linear-gradient(#a12a3a,#6d1824);border-color:#c0475a;color:#fff}
.hall{position:relative;overflow:hidden;border-radius:26px;text-align:center;border:1px solid #d9b45b66;
  background:radial-gradient(ellipse 80% 70% at 50% 0%,#5a1a28 0,#2a0a12 45%,#0b0507 100%);box-shadow:0 30px 60px #000a,inset 0 0 80px #000}
.rays{position:absolute;left:50%;top:-30%;width:1600px;height:1600px;margin-left:-800px;background:repeating-conic-gradient(#d9b45b12 0 5deg,transparent 5deg 10deg);
  -webkit-mask:radial-gradient(circle,#000 0,transparent 60%);mask:radial-gradient(circle,#000 0,transparent 60%);animation:spin 160s linear infinite;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
.bokeh{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.bulbs-row{position:absolute;left:14px;right:14px;height:12px;background:radial-gradient(circle,#fff3c4 0 3px,#f2d78c66 4px,transparent 6px) 0 50%/24px 12px repeat-x;animation:chase .9s steps(2) infinite;filter:drop-shadow(0 0 4px #f2d78c)}
.bulbs-row.top{top:10px}.bulbs-row.bot{bottom:10px}
@keyframes chase{to{background-position:12px 50%}}
.hall-in{position:relative;padding:clamp(40px,8vw,84px) 12px clamp(40px,7vw,72px);max-width:980px;margin:auto}
.eyebrow{font-size:11px;letter-spacing:.35em;text-transform:uppercase;color:var(--gold)}
.hall h1{margin:6px 0 0;font-weight:400;line-height:.95}
.gc-small{display:block;font-family:var(--f-display);font-size:clamp(18px,3.5vw,28px);letter-spacing:.3em;color:var(--ivory);text-transform:uppercase}
.gold-title{display:block;font-family:var(--f-display);font-size:clamp(46px,11.5vw,116px);letter-spacing:.01em;padding:0 .08em;
  background:linear-gradient(100deg,#9a6c22 0%,#f2d78c 25%,#fff7dc 38%,#d9b45b 50%,#9a6c22 70%,#f2d78c 85%,#fff7dc 100%);background-size:220% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 7s linear infinite;filter:drop-shadow(0 6px 18px #000)}
@keyframes shine{to{background-position:-220% 0}}
.lead{color:#e9dcc0;font-size:clamp(15px,2.2vw,18px);max-width:46ch;margin:18px auto 22px;text-wrap:balance}
.purse{display:inline-flex;align-items:center;gap:12px;padding:10px 22px 10px 12px;border-radius:999px;background:#000a;border:1px solid var(--gold);margin-bottom:22px;text-align:left}
.purse .ico{width:40px;height:40px;border-radius:50%;background:repeating-conic-gradient(var(--gold) 0 20deg,#7a5a17 20deg 40deg);box-shadow:inset 0 0 0 7px var(--gold),inset 0 0 0 8px #0005}
.purse small{display:block;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.purse b{font-size:26px;color:var(--gold-2)}
.btn.big{padding:15px 26px;font-size:16px;border-radius:14px;text-decoration:none;display:inline-block}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}
@media (max-width:760px){.how{grid-template-columns:1fr}}
.step{display:flex;gap:14px;align-items:flex-start;padding:16px;border-radius:16px;background:#0d1a16;border:1px solid #ffffff12}
.sn{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:20px;color:#2a1a02;background:linear-gradient(#f2d78c,#c99a37)}
.step b{font-size:16px}.step p{margin:3px 0 0;color:var(--muted);font-size:13px}
.duo{display:grid;grid-template-columns:1.2fr 1fr;gap:14px;margin-bottom:8px}
@media (max-width:760px){.duo{grid-template-columns:1fr}}
.jp-panel{border-radius:18px;padding:22px;text-align:center;background:linear-gradient(#1a0509,#0b0204);border:2px solid var(--gold);box-shadow:inset 0 0 40px #000,0 0 30px #d9b45b22}
.jp-panel p{color:var(--muted);margin:8px auto 14px;max-width:40ch;font-size:14px}
.led{font-family:'Courier New',monospace;font-weight:700;font-size:clamp(34px,7vw,56px);color:#ffcf5a;letter-spacing:.06em;margin-top:8px;padding:6px 14px;border-radius:10px;background:#000;display:inline-block;
  text-shadow:0 0 8px #ffb300,0 0 22px #ff8a00;box-shadow:inset 0 0 0 1px #ffffff14}
.member{text-align:left;border-radius:20px;padding:20px;color:var(--ivory);display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden;
  background:linear-gradient(135deg,#16120c,#050505 60%,#1b150b);border:1px solid #d9b45b88;box-shadow:0 20px 40px #000a;transition:transform .2s}
.member:hover{transform:translateY(-2px)}
.member::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,#ffffff12 45%,transparent 60%);pointer-events:none}
.m-top{display:flex;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.m-chip{width:36px;height:26px;border-radius:5px;background:linear-gradient(135deg,#f2d78c,#a07a2c);box-shadow:inset 0 0 0 1px #0004}
.m-tier{font-family:var(--f-display);font-size:30px;color:var(--gold-2);margin-top:6px}
.m-lv{font-size:14px;color:var(--muted)}
.m-txt{font-size:13px;color:#d9d0bc}.m-txt b{color:var(--gold-2)}
.m-foot{display:flex;justify-content:space-between;font-size:12px;color:var(--gold);margin-top:4px}
.room-t{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:30px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.room-t h2{font-family:var(--f-display);font-weight:400;font-size:28px;margin:0;color:var(--gold-2)}
.room-t span{color:var(--muted);font-size:13px}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.gc{text-align:left;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:#0c1613;display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s}
.gc:hover{transform:translateY(-4px);box-shadow:0 18px 34px #000a,0 0 0 1px var(--gold)}
.gc .art{height:160px;position:relative;display:grid;place-items:center;overflow:hidden;border-bottom:3px solid #3b2413;box-shadow:inset 0 0 40px #0009}
.felt{background:radial-gradient(ellipse at 50% 30%,#1f7a5a,#0d3f2d 75%)}
.felt-red{background:radial-gradient(ellipse at 50% 30%,#3a1a10,#140806 75%)}
.felt-blue{background:radial-gradient(ellipse at 50% 30%,#1f3f7a,#0c1a3a 75%)}
.felt-wine{background:radial-gradient(ellipse at 50% 30%,#8a2333,#2b0810 75%)}
.felt-navy{background:radial-gradient(ellipse at 50% 30%,#22306a,#0a0f2a 75%)}
.felt-wood{background:radial-gradient(ellipse at 50% 30%,#7a4a1c,#2b170a 75%)}
.gc .art .tag{position:absolute;top:10px;left:10px;font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;padding:4px 8px;border-radius:99px;background:#000b;color:var(--gold-2)}
.gc .bd{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.gc h3{margin:0;font-size:18px}
.gc p{margin:0;color:#c7d0c9;font-size:14px;flex:1}
.gc .meta{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
.gc .meta span:last-child{color:var(--gold)}
.gc .play{margin-top:6px;text-align:center;padding:9px;border-radius:10px;font-weight:800;font-size:14px;background:linear-gradient(#f2d78c,#c99a37);color:#2a1a02}
.mini-wheel{width:150px;height:150px;filter:drop-shadow(0 8px 12px #000c)}
.fan{display:flex;font-size:11px}
.fan .card{transform-origin:50% 120%}
.fan .card:nth-child(1){transform:rotate(-10deg)}.fan .card:nth-child(2){transform:rotate(8deg) translateY(-4px);margin-left:-1.4em}
.fan.wide{font-size:9.5px}.fan.wide .card{margin-left:-2.2em!important}
.fan.wide .card:nth-child(1){transform:rotate(-20deg);margin-left:0!important}.fan.wide .card:nth-child(2){transform:rotate(-10deg) translateY(-5px)}.fan.wide .card:nth-child(3){transform:translateY(-7px)}.fan.wide .card:nth-child(4){transform:rotate(10deg) translateY(-5px)}.fan.wide .card:nth-child(5){transform:rotate(20deg)}
.stack{position:absolute;right:28px;bottom:22px;display:flex;flex-direction:column-reverse}
.stack b{width:38px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 2px 0 #0008,inset 0 0 0 2px #fff6;margin-top:-4px}
.badge9{position:absolute;bottom:14px;right:14px;font-family:var(--f-display);color:var(--gold-2);font-size:18px}
.mini-dice{display:flex;gap:14px}.mini-dice .die{width:58px;height:58px;padding:8px}.mini-dice .die i{width:10px;height:10px;visibility:hidden}
.mini-dice .die:first-child{transform:rotate(-14deg)}.mini-dice .die:last-child{transform:rotate(11deg) translateY(8px)}
.mini-reels{display:flex;gap:6px;padding:8px;border-radius:12px;background:#0b0306;border:2px solid var(--gold);box-shadow:0 0 24px #f2d78c55}
.mini-reels span{width:52px;height:68px;display:grid;place-items:center;font-size:48px;border-radius:6px;background:linear-gradient(#e9e2cf,#fffdf5 40%,#d9d0b8);animation:glow7 1.4s ease-in-out infinite alternate}
@keyframes glow7{to{box-shadow:inset 0 0 0 3px #f2d78c,0 0 12px #f2d78c}}
.mini-keno{display:grid;grid-template-columns:repeat(8,22px);gap:4px}
.mini-keno i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:9px;font-weight:800;background:#f4ecd8;color:#222}
.mini-keno i.on{background:#b3202c;color:#fff;box-shadow:0 0 8px #ff5a6a}
.mini-rack{display:flex;align-items:center;gap:0;margin-left:110px}
.mini-rack div{display:flex;flex-direction:column;margin-left:-3px}
.mini-rack i{width:24px;height:24px;border-radius:50%;margin:0;display:grid;place-items:center;font-style:normal;font-size:9px;font-weight:800;color:#111;
  background:radial-gradient(circle at 35% 30%,#fff9 0 10%,transparent 30%),radial-gradient(circle,#fff 0 30%,var(--b) 32%);box-shadow:0 3px 4px #0008}
.mini-rack i.st{background:radial-gradient(circle at 35% 30%,#fff9 0 10%,transparent 30%),radial-gradient(circle,#fff 0 30%,transparent 32%),linear-gradient(#f4ecd8 0 22%,var(--b) 22% 78%,#f4ecd8 78%)}
.mini-cue{position:absolute;left:-10px;top:50%;width:36%;height:7px;border-radius:4px;transform:rotate(-4deg);background:linear-gradient(90deg,#2b1208 0 35%,#1a1a1a 35% 48%,#d9b47a 48% 96%,#f4ecd8 96% 98%,#3d7fd6 98%);box-shadow:4px 8px 6px #0006}
.mini-cue::after{content:"";position:absolute;right:-30px;top:-8px;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 20%,#ddd 60%,#aaa)}
.disc{margin-top:30px;color:#7d8c83;font-size:12px;text-align:center}


/* Fachada */
body.facade-mode{padding-bottom:0;overflow:hidden}
body.facade-mode .stage{margin-top:12px}
.facade{position:relative;overflow:hidden;border-radius:22px;border:1px solid #d9b45b55;
  background:radial-gradient(1.2px 1.2px at 12% 18%,#fff,transparent),radial-gradient(1px 1px at 28% 8%,#fff,transparent),radial-gradient(1.4px 1.4px at 44% 22%,#fffbe0,transparent),radial-gradient(1px 1px at 63% 12%,#fff,transparent),radial-gradient(1.2px 1.2px at 78% 26%,#fff,transparent),radial-gradient(1px 1px at 90% 9%,#fff,transparent),radial-gradient(1px 1px at 6% 40%,#fff,transparent),radial-gradient(1px 1px at 95% 38%,#fff,transparent),radial-gradient(1.2px 1.2px at 35% 34%,#fff,transparent),radial-gradient(1px 1px at 55% 4%,#fff,transparent),
  linear-gradient(#040714 0%,#0d0b26 45%,#2a1030 75%,#4a1a2a 100%)}
.bld{position:absolute;inset:0;width:100%;height:100%;overflow:visible;transition:transform .8s cubic-bezier(.5,0,.8,.4),opacity .8s}
.facade.zoom .bld{transform:scale(5);opacity:0}
.facade.zoom::after{content:"";position:absolute;inset:0;background:#fff3d6;animation:fadein .8s .15s both}
@keyframes fadein{from{opacity:0}}
.moon{position:absolute;top:7%;right:9%;width:clamp(36px,6vw,64px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fffbe8,#e8dcb8);box-shadow:0 0 40px 10px #fff3c433}
.beam{position:absolute;bottom:18%;width:90px;height:120%;transform-origin:50% 100%;background:linear-gradient(to top,#fff6d855,transparent 85%);clip-path:polygon(44% 100%,56% 100%,100% 0,0 0);filter:blur(2px);pointer-events:none}
.beam.b1{left:22%;animation:sweep 7s ease-in-out infinite alternate}
.beam.b2{right:22%;animation:sweep 8s ease-in-out -3s infinite alternate-reverse}
@keyframes sweep{from{transform:rotate(-28deg)}to{transform:rotate(24deg)}}
.sign-t{font-family:'Limelight',Georgia,serif;font-size:50px;fill:url(#gold)}
.canopy-t{font-family:'Manrope',sans-serif;font-weight:800;font-size:17px;letter-spacing:.16em;fill:#fff3d6}
.sb{fill:#fff3c4}.sb.a{animation:bulb 1s steps(1) infinite}.sb.b{animation:bulb 1s steps(1) -.5s infinite}
@keyframes bulb{50%{fill:#7a5a17}}
.win{fill:#2a2030}.win.lit{fill:#f2c46b;opacity:.85}.win.fl{animation:flick 4s infinite}
@keyframes flick{0%,100%{opacity:.85}48%{opacity:.85}50%{opacity:.35}53%{opacity:.85}}
.beacon{fill:#ff3b4e;animation:bulb 1.6s steps(1) infinite}
.door{cursor:pointer;outline:none}
.door-ring{animation:ring 1.6s ease-in-out infinite;filter:drop-shadow(0 0 6px #f2d78c)}
@keyframes ring{50%{stroke-opacity:.2}}
.door:hover .door-ring,.door:focus-visible .door-ring{stroke:#fff;stroke-width:5}
.leafL,.leafR{transform-box:fill-box;transition:transform .6s cubic-bezier(.3,.7,.3,1)}
.leafL{transform-origin:0 50%}.leafR{transform-origin:100% 50%}
.door.open .leafL,.door.open .leafR{transform:scaleX(.08)}
.hint{position:absolute;left:50%;bottom:max(10px,2%);transform:translateX(-50%);padding:8px 16px;border-radius:99px;background:#000b;border:1px solid var(--gold);color:var(--gold-2);font-weight:800;font-size:14px;white-space:nowrap;animation:hint 1.6s ease-in-out infinite;pointer-events:none}
@keyframes hint{50%{transform:translate(-50%,-4px)}}
@media (max-width:600px){.hint{bottom:auto;top:14px}}
/* Salón */
.salon-h{text-align:center;padding:10px 0 6px}
.salon-h h2{font-family:var(--f-display);font-weight:400;font-size:clamp(34px,6vw,52px);margin:4px 0;color:var(--gold-2)}
.salon-h p{color:var(--muted);margin:0 auto 14px;max-width:52ch}
.strip{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:stretch}
.s-jp,.s-mem{display:flex;flex-direction:column;justify-content:center;gap:2px;padding:8px 14px;border-radius:14px;background:#0b0204;border:1px solid var(--gold);text-align:center}
.s-jp small,.s-mem small{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
.s-jp .led{font-size:24px;margin:0;padding:2px 10px}
.s-mem{background:linear-gradient(135deg,#16120c,#050505);color:var(--ivory)}.s-mem span{font-size:13px}
.room-list{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
@media (max-width:900px){.room-list{grid-template-columns:1fr}}
.rrow{display:grid;grid-template-columns:128px 1fr;grid-template-rows:auto auto;gap:10px 14px;align-items:center;padding:12px;border-radius:18px;background:#0c1613;border:1px solid var(--line)}
.rrow:hover{box-shadow:0 0 0 1px var(--gold)}
.thumb{grid-row:1/3;width:128px;height:112px;border-radius:12px;overflow:hidden;position:relative;box-shadow:inset 0 0 30px #000a;border:2px solid #3b2413}
.thumb .in{position:absolute;left:50%;top:50%;width:230px;height:170px;margin:-85px 0 0 -115px;transform:scale(.6);display:grid;place-items:center}
.rinfo{min-width:0}.rinfo h3{margin:0;font-size:18px}.rinfo p{margin:2px 0 4px;color:#c7d0c9;font-size:13.5px}
.rinfo .meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted)}.rinfo .meta span:last-child{color:var(--gold)}
.enter{grid-column:2;letter-spacing:.08em;font-size:14px;padding:12px}
@media (max-width:480px){.rrow{grid-template-columns:96px 1fr}.thumb{width:96px;height:96px;grid-row:1}.thumb .in{transform:scale(.45)}.enter{grid-column:1/-1}}

/* Personajes 3D */
.stage3d{position:relative;margin:0 0 12px;border-radius:14px;overflow:hidden;background:#0b0a0c;border:1px solid #d9b45b44}
.stage3d canvas{display:block;width:100%}
.stg-labels{position:absolute;inset:0;pointer-events:none}
.stl{position:absolute;transform:translate(-50%,0);background:#000c;border:1px solid #d9b45b55;border-radius:8px;padding:2px 8px 3px;text-align:center;font-size:11px;white-space:nowrap;transition:border-color .2s,box-shadow .2s}
.stl b{display:block;color:var(--gold-2);font-size:12px}
.stl.me b{color:#9ec5ff}
.stl.talk{border-color:var(--gold-2);box-shadow:0 0 12px #f2d78c99}
.stl em{display:block;font-style:normal;color:#e9dcc0;font-size:11px}
.stl .mc{display:block}
.stl .mc i{display:inline-block;width:20px;height:28px;border-radius:3px;background:#fff;color:#111;font-size:9px;font-weight:800;margin:2px 1px 0;line-height:28px;font-style:normal}
.stl .mc i.r{color:#b3202c}
.stl .mc i.b{background:repeating-linear-gradient(45deg,#7d1f2c 0 3px,#5e1620 3px 6px);border:1px solid #f4ecd8}
.dbtn{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;background:#fff;color:#111;font-size:9px;font-style:normal;font-weight:900}
.stg-edit{position:absolute;right:8px;top:8px;padding:6px 10px!important;font-size:12px!important;background:#000a!important}
.chgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.chc{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;border-radius:12px;border:1px solid #ffffff1a;background:#0005;text-align:center}
.chc.on{border-color:var(--gold-2);background:#d9b45b26;box-shadow:0 0 0 2px #d9b45b55}
.chf{width:62px;height:62px;border-radius:50%;background-size:cover;background-position:center;border:2px solid #d9b45b99;display:inline-block;flex:none;vertical-align:middle}
.chf.sm{width:30px;height:30px;border-width:1px}
.avs .chf.sm+.chf.sm{margin-left:-10px}
.chc b{font-size:13px}.chc small{font-size:10px;color:var(--muted)}
.avs{display:flex;flex:none}
.spinb{width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#e4e0d6 60%,#a9a59c);position:relative;flex:none;box-shadow:0 0 0 2px #d9b45b66}
.spinb i{position:absolute;width:10px;height:10px;border-radius:50%;background:#c4141f;transform:translate(-50%,-50%);left:50%;top:50%;pointer-events:none}
.pl-ctl2{grid-template-columns:auto 1fr auto auto}
.bj-mates{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.bjm{font-size:12px;background:#0005;border-radius:10px;padding:6px 8px;min-width:90px}
.bjm .cards{font-size:8px;min-height:0}.bjm b{display:block;color:var(--gold-2)}.bjm em{display:block;font-style:normal;font-weight:800}
.mm{position:absolute;top:2px;width:16px;height:16px;border-radius:50%;background:var(--mc);color:#fff;font-size:9px;font-style:normal;font-weight:800;display:grid;place-items:center;border:1px solid #fff;z-index:3;pointer-events:none}
.he-felt{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px;border-radius:120px;background:radial-gradient(ellipse,#1d7254,#0d3f2d 70%);border:6px solid #3b2413;box-shadow:inset 0 0 30px #0008}
.he-pot{font-weight:800;color:var(--gold-2);min-height:20px}
.he-stage{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#f4ecd8aa;min-height:14px}
.he-board .card+.card{margin-left:.35em!important}
.card.slot{background:#0003;box-shadow:inset 0 0 0 2px #ffffff22}
.he-me{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:14px;flex-wrap:wrap}
.he-mi{display:flex;flex-direction:column;gap:2px;font-size:13px}.he-mi b{color:#9ec5ff}
@media (max-width:699px){.pl-wrap .pl-ctl2{grid-template-columns:auto 1fr auto auto auto}.spinb{width:38px;height:38px}}
/* Cabecera de juego */
.gh{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.back{padding:8px 14px;border-radius:999px;border:1px solid var(--line);font-weight:700;font-size:13px}
.gh h2{font-family:var(--f-display);font-weight:400;font-size:clamp(24px,4vw,32px);margin:0;color:var(--gold-2);line-height:1}
.gh p{margin:0;color:var(--muted);font-size:13px;flex-basis:100%}
@media (min-width:700px){.gh p{flex-basis:auto;margin-left:auto}}
.table{border-radius:22px;padding:18px;background:radial-gradient(ellipse at 50% 0%,#1a5a43,var(--felt) 55%,var(--felt-2));border:10px solid #3b2413;box-shadow:inset 0 0 0 2px #d9b45b55,0 20px 40px #0009;position:relative}
@media (max-width:520px){.table{border-width:6px;padding:12px;border-radius:16px}}
.msg{text-align:center;min-height:24px;font-weight:700;color:var(--gold-2);margin:10px 0;font-size:15px}
.msg.win{color:#9ef0b5}
.msg.lose{color:#ffb3b3}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.actions .btn{min-width:96px}

/* Fichas */
.chipbar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.chip{--c:#2a5db0;width:46px;height:46px;border-radius:50%;font-size:11px;font-weight:800;color:#fff;
  background:radial-gradient(circle,var(--c) 0 55%,transparent 56%),repeating-conic-gradient(var(--c) 0 22.5deg,#f4ecd8 22.5deg 45deg);
  box-shadow:inset 0 0 0 3px var(--c),inset 0 0 0 4px #0003,0 3px 0 #0007;text-shadow:0 1px 2px #000;transition:transform .12s;flex:none}
.chip:hover{transform:translateY(-2px)}
.chip.sel{transform:translateY(-5px);box-shadow:inset 0 0 0 3px var(--c),0 0 0 3px var(--gold-2),0 8px 14px #000a}
.v10{--c:#3b6fc4}.v25{--c:#1f8a4c}.v100{--c:#1b1b1b}.v500{--c:#6b2fa0}.v1000{--c:#c28a12}.v5000{--c:#b3202c}.v25000{--c:#127a7a}.v100000{--c:#c23f86}
.mk{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);min-width:30px;height:30px;padding:0 4px;border-radius:99px;display:grid;place-items:center;
  font-style:normal;font-size:10px;font-weight:800;color:#fff;background:radial-gradient(circle,#c28a12 0 52%,#f2d78c 53% 62%,#c28a12 63%);box-shadow:0 2px 6px #000a;pointer-events:none;z-index:2}

/* Cartas */
.cards{display:flex;justify-content:center;min-height:calc(4.6em*1.4);font-size:clamp(11px,3.2vw,16px)}
.card{width:4.6em;aspect-ratio:5/7;border-radius:.5em;background:linear-gradient(160deg,#fffdf6,#ece3cd);color:#171717;position:relative;
  box-shadow:0 .25em .7em #0007;font-weight:800;flex:none}
.cards .card+.card{margin-left:-1.5em}
.card.red{color:#b3202c}
.card .tl,.card .br{position:absolute;line-height:.95;text-align:center;font-size:1.05em}
.card .tl{top:.3em;left:.35em}
.card .br{bottom:.3em;right:.35em;transform:rotate(180deg)}
.card .cs{position:absolute;inset:0;display:grid;place-items:center;font-size:2.2em}
.card.back{background:repeating-linear-gradient(45deg,#7d1f2c 0 .35em,#5e1620 .35em .7em);box-shadow:inset 0 0 0 .3em var(--ivory),inset 0 0 0 .45em var(--gold),0 .25em .7em #0007}
.card.deal{animation:deal .35s cubic-bezier(.2,.8,.3,1.1) both}
@keyframes deal{from{transform:translate(2em,-4em) rotate(-14deg);opacity:0}}
.card.flip{animation:flip .4s both}
@keyframes flip{0%{transform:rotateY(90deg)}100%{transform:none}}
.total{display:inline-block;margin-top:6px;padding:2px 10px;border-radius:99px;background:#0008;font-weight:800;font-size:13px}
.lbl{font-size:11px;letter-spacing:.25em;text-transform:uppercase;color:#d9b45bcc;text-align:center;margin-bottom:6px}

/* Ruleta */
.ro-top{display:grid;grid-template-columns:minmax(0,340px) 1fr;gap:18px;align-items:center}
@media (max-width:700px){.ro-top{grid-template-columns:1fr}}
.ro-wheel{position:relative;width:100%;max-width:340px;margin:auto}
.ro-wheel canvas{width:100%;height:auto;display:block;filter:drop-shadow(0 14px 20px #000a)}
.ro-side{display:flex;flex-direction:column;gap:10px}
.ro-big{font-family:var(--f-display);font-size:64px;line-height:1;text-align:center;width:110px;height:110px;margin:auto;border-radius:50%;display:grid;place-items:center;border:3px solid var(--gold);background:#0008}
.hist{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.hist span{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;border:1px solid #fff3}
.rN{background:var(--red)}.bN{background:var(--black)}.gN{background:var(--green)}
.scroll-x{overflow-x:auto;margin-top:16px;padding-bottom:6px}
.rb{display:grid;grid-template-columns:44px repeat(12,minmax(34px,1fr)) 46px;grid-template-rows:repeat(3,46px) 40px 40px;gap:3px;min-width:520px}
.rc{position:relative;display:grid;place-items:center;font-weight:800;font-size:15px;border:1px solid #f4ecd855;border-radius:4px;user-select:none;transition:filter .15s}
.rc:hover{filter:brightness(1.3)}
.rc.red{background:#9e1c27}.rc.blk{background:#161616}.rc.zero{background:#17703d}
.rc.out{background:#0c3125;font-size:12px;letter-spacing:.04em}
.rc.hit{animation:hit 1s ease 3}
@keyframes hit{50%{box-shadow:0 0 0 3px var(--gold-2),0 0 22px var(--gold-2);filter:brightness(1.6)}}
.diam{width:22px;height:22px;transform:rotate(45deg);border-radius:3px}

/* Tragaperras */
.sl-cab{max-width:640px;margin:auto;border-radius:26px;padding:16px;background:linear-gradient(#3a0f18,#1a0509);border:3px solid var(--gold);box-shadow:0 0 0 6px #1a0509,0 0 40px #d9b45b33,inset 0 0 30px #000}
.sl-jp{text-align:center;margin-bottom:12px}
.sl-jp .k{font-size:11px;letter-spacing:.3em;color:var(--gold);text-transform:uppercase}
.sl-jp .v{font-family:var(--f-display);font-size:clamp(28px,6vw,40px);color:var(--gold-2);text-shadow:0 0 18px #f2d78c88}
.reels{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:8px;border-radius:14px;background:#0b0306;box-shadow:inset 0 6px 16px #000}
.reel{height:calc(var(--ch)*3);overflow:hidden;border-radius:8px;background:linear-gradient(#e9e2cf,#fffdf5 30%,#fffdf5 70%,#d9d0b8);position:relative}
.reel::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(#0006,transparent 22%,transparent 78%,#0006)}
.strip{will-change:transform}
.cell{height:var(--ch);display:grid;place-items:center;font-size:calc(var(--ch)*.55);line-height:1;transition:background .2s}
.cell.win{animation:cw .6s ease infinite alternate}
@keyframes cw{to{background:#f2d78c;box-shadow:inset 0 0 0 3px #c28a12}}
.sym-seven{font-family:var(--f-display);color:#c4141f;-webkit-text-stroke:1px #6b0a10;text-shadow:0 2px 0 #f2d78c}
.sym-bar{font-weight:800;font-size:calc(var(--ch)*.28);color:#fff;background:#151515;padding:.15em .35em;border-radius:.25em;letter-spacing:.06em;box-shadow:0 0 0 .12em #c28a12}
.sl-info{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.sl-info>div{background:#0007;border:1px solid #d9b45b44;border-radius:10px;padding:6px 8px;text-align:center}
.sl-info .k{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.sl-info .v{font-weight:800;font-size:17px;color:var(--gold-2)}
.stepper{display:flex;align-items:center;justify-content:center;gap:6px}
.stepper button{width:26px;height:26px;border-radius:50%;background:#ffffff14;font-weight:800}
.spinbtn{width:100%;margin-top:12px;padding:16px;font-size:20px;border-radius:16px;font-family:var(--f-display);letter-spacing:.08em}
.free-b{text-align:center;margin-top:8px;font-weight:800;color:#9ef0b5}

/* Video póker */
.pay{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:14px;background:#06140fcc;border:2px solid var(--gold);border-radius:8px;overflow:hidden}
.pay td{padding:4px 10px;border-bottom:1px solid #d9b45b22;color:#f2d78c}
.pay td:last-child{text-align:right;font-weight:800}
.pay tr.on td{background:var(--gold);color:#2a1a02}
.vp-cards{display:flex;gap:8px;justify-content:center;font-size:clamp(11px,3.4vw,17px)}
.vp-slot{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer}
.held{font-size:11px;font-weight:800;letter-spacing:.15em;padding:2px 8px;border-radius:4px;background:var(--gold);color:#2a1a02;visibility:hidden}
.vp-slot.h .held{visibility:visible}
.vp-slot.h .card{transform:translateY(-8px);box-shadow:0 0 0 3px var(--gold-2),0 10px 16px #0009}

/* Baccarat */
.bc-hands{display:grid;grid-template-columns:1fr 1fr;gap:12px;text-align:center}
.bc-areas{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:16px}
.area{position:relative;min-height:84px;border:2px solid #f4ecd877;border-radius:14px;padding:10px;text-align:center;font-weight:800;letter-spacing:.06em;transition:background .2s}
.area:hover{background:#ffffff0d}
.area small{display:block;font-weight:600;color:var(--muted);letter-spacing:0;font-size:11px}
.area .mk{top:auto;bottom:-6px;transform:translate(-50%,0)}
.area.pl{border-color:#6f9cf0}.area.bk{border-color:#ff7a86}.area.ti{border-color:#7ee2a2}
.area.won{box-shadow:0 0 0 3px var(--gold-2),0 0 22px #f2d78c88}
.road{display:grid;grid-auto-flow:column;grid-template-rows:repeat(6,16px);grid-auto-columns:16px;gap:2px;overflow-x:auto;padding:8px;border-radius:8px;background:#f4ecd8;margin-top:14px;min-height:118px}
.road i{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;font-size:9px;font-style:normal;font-weight:800;color:#fff}
.road .P{background:#2a5db0}.road .B{background:#b3202c}.road .T{background:#1f8a4c}

/* Dados */
.dice{display:flex;gap:16px;justify-content:center;margin:8px 0}
.die{width:64px;height:64px;border-radius:12px;background:linear-gradient(145deg,#fff,#e3d9c2);display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:9px;box-shadow:0 8px 14px #0008,inset 0 -3px 0 #0002}
.die i{width:11px;height:11px;border-radius:50%;background:#b3202c;place-self:center;visibility:hidden}
.die.roll{animation:roll .7s cubic-bezier(.3,.7,.4,1)}
@keyframes roll{0%{transform:translate(-120px,-40px) rotate(-260deg)}70%{transform:translate(6px,2px) rotate(20deg)}100%{transform:none}}
.points{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:10px}
.points div{position:relative;text-align:center;font-family:var(--f-display);font-size:26px;padding:8px 0;border:2px solid #f4ecd855;border-radius:8px}
.puck{position:absolute;top:-10px;right:-6px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-body);font-size:10px;font-weight:800;background:#fff;color:#111;box-shadow:0 3px 8px #000a}
.cr-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.cr-grid .full{grid-column:1/-1}
.area.off{opacity:.45}

/* Keno */
.kn{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.kn button{aspect-ratio:1;border-radius:50%;font-weight:800;font-size:clamp(10px,2.6vw,14px);background:#f4ecd8;color:#1a1a1a;transition:transform .15s,background .15s}
.kn button.p{background:var(--gold);color:#2a1a02;box-shadow:0 0 0 2px var(--gold-2)}
.kn button.d{background:#b3202c;color:#fff}
.kn button.h{background:#1f8a4c;color:#fff;transform:scale(1.12);box-shadow:0 0 0 3px var(--gold-2),0 0 14px var(--gold-2)}
.kn-side{display:grid;grid-template-columns:1fr 240px;gap:16px}
@media (max-width:720px){.kn-side{grid-template-columns:1fr}}
.kp{font-size:13px}
.kp div{display:flex;justify-content:space-between;padding:4px 8px;border-bottom:1px solid #d9b45b22}
.kp div.on{background:var(--gold);color:#2a1a02;font-weight:800;border-radius:6px}

/* Modales y avisos */
.ov{position:fixed;inset:0;z-index:50;background:#000b;display:grid;place-items:center;padding:16px;backdrop-filter:blur(3px)}
.modal{width:min(560px,100%);max-height:88vh;overflow:auto;border-radius:20px;background:linear-gradient(160deg,#142e26,#0a1713);border:1px solid var(--gold);padding:22px;box-shadow:0 30px 60px #000}
.modal h3{font-family:var(--f-display);font-weight:400;font-size:28px;color:var(--gold-2);margin:0 0 6px}
.modal p{color:var(--muted);margin:0 0 12px}
.achs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:480px){.achs{grid-template-columns:1fr}}
.ach{padding:10px;border-radius:12px;border:1px solid #ffffff1a;background:#0005;font-size:13px}
.ach b{display:block}
.ach span{color:var(--muted);font-size:12px}
.ach.ok{border-color:var(--gold);background:#d9b45b1c}
.ach.ok b::before{content:"✓ ";color:var(--gold-2)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 16px}
.stats div{background:#0005;border-radius:10px;padding:10px}
.stats span{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em}
.stats b{font-size:18px;color:var(--gold-2)}
.toasts{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;width:min(420px,calc(100% - 32px));pointer-events:none}
.toast{padding:10px 16px;border-radius:12px;background:#101c18f2;border:1px solid #ffffff22;font-weight:700;font-size:14px;box-shadow:0 10px 24px #000a;animation:tin .3s both;text-align:center}
.toast.gold{border-color:var(--gold);color:var(--gold-2)}
@keyframes tin{from{transform:translateY(20px);opacity:0}}
#bigwin{position:fixed;inset:0;z-index:70;display:grid;place-items:center;background:radial-gradient(circle,#2b1606dd,#000e)}
#coins{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.bw-in{position:relative;text-align:center;animation:pop .6s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.bw-t{font-family:var(--f-display);font-size:clamp(36px,10vw,80px);color:var(--gold-2);text-shadow:0 0 30px #f2d78c,0 6px 0 #7a5a17;line-height:1}
.bw-n{font-family:var(--f-display);font-size:clamp(30px,8vw,64px);color:#fff;margin:10px 0 20px}
.wheel-wrap{position:relative;width:min(320px,80vw);margin:8px auto 14px}
.wheel-wrap canvas{width:100%;height:auto;display:block}
.pointer{position:absolute;left:50%;top:-6px;transform:translateX(-50%);width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:26px solid var(--gold-2);filter:drop-shadow(0 3px 3px #000)}
.pl-ctl{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;margin-top:10px}
.pl-ctl .btn{min-width:52px;padding:12px;touch-action:none;user-select:none}
.pl-pow{position:relative;height:50px;border-radius:12px;background:#0008;border:1px solid var(--line);overflow:hidden;touch-action:none;cursor:ew-resize;user-select:none}
.pl-pow i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#9ef0b5,#f2d78c,#ff7a86);opacity:.6}
.pl-pow span{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:0 8px;font-size:12px;font-weight:700;pointer-events:none}
.bub{position:absolute;top:10px;max-width:min(46%,260px);padding:8px 12px 9px;border-radius:14px;background:#fffdf5;color:#1a1a1a;font-weight:700;font-size:13px;line-height:1.3;box-shadow:0 10px 24px #000a;opacity:0;transform:translateY(-8px) scale(.94);transition:opacity .25s,transform .25s;pointer-events:none;z-index:3}
.bub.show{opacity:1;transform:none}
.bub b{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#2a5db0;margin-bottom:2px}
.bub.c b{color:#9e1c27}
.bub.p{left:10px}.bub.c{right:10px;text-align:right}
.bub::after{content:"";position:absolute;bottom:-7px;width:14px;height:14px;background:#fffdf5;transform:rotate(45deg)}
.bub.p::after{left:18px}.bub.c::after{right:18px}
.pp.talk .av{animation:talkp .35s ease-in-out infinite alternate}
@keyframes talkp{to{transform:scale(1.12);box-shadow:0 0 0 3px #fff6}}
@media (max-width:699px){
 .pl-wrap .pl-ctl2{position:absolute;left:8px;right:8px;bottom:8px;margin:0;z-index:2;grid-template-columns:auto 1fr auto auto;gap:6px;padding:8px;border-radius:16px;background:#000000b8;backdrop-filter:blur(6px);border:1px solid #d9b45b55}

<script>
'use strict';
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const TAU=Math.PI*2;
const fmt=n=>Math.floor(n).toLocaleString('es-ES');
const short=v=>v>=1000?(v/1000)+'K':String(v);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function rnd(n){const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}

/* ---------- Estado y guardado ---------- */
const KEY='medianoche-casino-v1';
let S=null;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
S=Object.assign({chips:10000,xp:0,level:1,chip:100,sound:true,lastBonus:0,jackpot:250000,ach:{},played:{},stats:{rounds:0,wagered:0,won:0,biggest:0,wins:0}},S||{});
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const need=l=>Math.round(250*Math.pow(l,1.55));
const TIERS=[[1,'Bronce',1],[5,'Plata',1.5],[10,'Oro',2],[20,'Platino',3],[35,'Diamante',5]];
const tier=()=>{let t=TIERS[0];for(const x of TIERS)if(S.level>=x[0])t=x;return t};

/* ---------- Sonido sintetizado ---------- */
let AC=null;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return null}}if(AC.state==='suspended')AC.resume();return AC}
function tone(f,d,type='sine',v=.12,when=0){const a=ac();if(!a||!S.sound)return;const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;const t=a.currentTime+when;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.05)}
function noise(d,when=0,freq=1800,v=.18){const a=ac();if(!a||!S.sound)return;const b=a.createBuffer(1,Math.max(1,a.sampleRate*d|0),a.sampleRate),x=b.getChannelData(0);for(let i=0;i<x.length;i++)x[i]=(Math.random()*2-1)*(1-i/x.length);const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=freq;const g=a.createGain();g.gain.value=v;s.connect(f).connect(g).connect(a.destination);s.start(a.currentTime+when)}
const SFX={
  click:()=>tone(880,.05,'square',.04),
  chip:()=>{tone(2400,.04,'triangle',.07);tone(3300,.04,'triangle',.05,.025)},
  card:()=>noise(.07,0,2500,.2),
  win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.28,'triangle',.11,i*.08)),
  big:()=>{[523,659,784,1047,1319,1568].forEach((f,i)=>tone(f,.5,'triangle',.13,i*.09));for(let i=0;i<14;i++)tone(2000+rnd(1500),.08,'sine',.05,.5+i*.07)},
  lose:()=>{tone(330,.18,'sine',.07);tone(247,.3,'sine',.07,.15)},
  err:()=>tone(150,.2,'sawtooth',.06),
  tick:()=>tone(1700,.015,'square',.025),

/* ---------- HUD ---------- */
let shown=S.chips;
function hud(){
  const el=$('#hChips'),from=shown,to=S.chips,t0=performance.now();shown=to;
  const step=now=>{const t=Math.min(1,(now-t0)/450);el.textContent=fmt(from+(to-from)*(1-Math.pow(1-t,3)));if(t<1)requestAnimationFrame(step)};requestAnimationFrame(step);

  $('#hXp').textContent=fmt(S.xp)+' / '+fmt(need(S.level))+' puntos';
  $('#hBar').style.width=Math.min(100,S.xp/need(S.level)*100)+'%';

}
const BONUS_MS=4*3600e3;
function bonusTimer(){const left=S.lastBonus+BONUS_MS-Date.now();const b=$('#bonusT');

  else{const h=Math.floor(left/3600e3),m=Math.floor(left%3600e3/60e3);b.textContent=`${h}h ${String(m).padStart(2,'0')}m`}}
setInterval(bonusTimer,30000);

function toast(t,cls=''){const d=document.createElement('div');d.className='toast '+cls;d.textContent=t;$('#toasts').appendChild(d);setTimeout(()=>d.remove(),3200)}

/* ---------- Economía ---------- */
function take(a){if(a>S.chips){toast('Saldo insuficiente para esa apuesta');sfx('err');return false}S.chips-=a;hud();save();return true}
function give(a){S.chips+=a;hud();save()}
function addXP(bet){S.xp+=Math.ceil(bet/10);let up=false;
  while(S.xp>=need(S.level)){S.xp-=need(S.level);S.level++;up=true;const reward=1000*S.level;S.chips+=reward;
    setTimeout(()=>{sfx('level');toast(`Subes al nivel ${S.level} · +${fmt(reward)} fichas`,'gold')},400);
    if(S.level>=5)ach('lvl5');if(S.level>=10)ach('lvl10');if(S.level>=20)ach('lvl20');}
  return up}
function settle(game,bet,ret,ref){
  ref=ref||bet;S.chips+=ret;S.stats.rounds++;S.stats.wagered+=bet;S.stats.won+=ret;S.played[game]=1;
  const net=ret-bet;if(net>0){S.stats.wins++;ach('first')}
  if(net>S.stats.biggest)S.stats.biggest=net;
  if(bet>0)addXP(bet);
  if(net>=50000)ach('big50');if(S.stats.wagered>=100000)ach('high');if(S.stats.wagered>=1000000)ach('whale');
  if(Object.keys(S.played).length>=7)ach('all');
  if(net>0&&((net>=ref*10&&net>=1000)||net>=25000))bigWin(net,ref);else if(net>0)sfx('win');else if(ret===0&&bet>0)sfx('lose');
  if(STG.game===game&&['slots','keno','poker','dados'].includes(game)){const r=net>=Math.max(1000,ref*10)?'big':net>0?'win':(bet>0&&ret<bet)?'lose':null;
    if(r&&Math.random()<(game==='slots'?(r==='big'?1:.35):.8)){if(Math.random()<.45)say(S.me,r==='lose'?'mal':'bien');matesReact(game,r)}}
  hud();save();setTimeout(checkBroke,1200);
}
function checkBroke(){if(S.chips<10&&!$('#modalRoot').innerHTML&&$('#bigwin').hidden){

/* ---------- Gran premio ---------- */
let bwRaf=0;
function bigWin(net,ref){
  sfx('big');const o=$('#bigwin');o.hidden=false;const x=net/(ref||1);
  $('#bwT').textContent=x>=100?'MEGA PREMIO':x>=30?'SÚPER PREMIO':'GRAN PREMIO';
  const n=$('#bwN'),t0=performance.now();
  const cv=$('#coins'),c=cv.getContext('2d');cv.width=innerWidth;cv.height=innerHeight;
  const P=Array.from({length:110},()=>({x:Math.random()*cv.width,y:-Math.random()*cv.height,v:2+Math.random()*5,s:8+Math.random()*12,a:Math.random()*TAU,w:.05+Math.random()*.15}));

  const f=now=>{const t=Math.min(1,(now-t0)/1800);n.textContent='+'+fmt(net*(1-Math.pow(1-t,3)));

      const sx=Math.abs(Math.cos(p.a));c.beginPath();c.ellipse(p.x,p.y,p.s*sx+1,p.s,0,0,TAU);
      const g=c.createLinearGradient(p.x-p.s,p.y,p.x+p.s,p.y);g.addColorStop(0,'#7a5a17');g.addColorStop(.5,'#f2d78c');g.addColorStop(1,'#c28a12');c.fillStyle=g;c.fill()}

  let win=0;for(let k=0;k<sims;k++){const d=pool.slice();for(let i=d.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[d[i],d[j]]=[d[j],d[i]]}let p=0;
    const bd=board.concat(d.slice(p,p+5-board.length));p+=5-board.length;const me=best7(hole.concat(bd));let best=true,tie=0;
    for(let o=0;o<nOpp;o++){const s=best7([d[p],d[p+1]].concat(bd));p+=2;if(s>me){best=false;break}if(s===me)tie++}
    if(best)win+=tie?1/(tie+1):1}return win/sims}

    P3.spotList=cand.map(q=>({q,d:Math.hypot(q[0]-cx,q[1]-cz)+Math.min(4,Math.hypot(q[0]-sx,q[1]-sz))*.3})).sort((a,b)=>b.d-a.d).map(o=>o.q)}
  const spots=P3.spotList||[[-3.3,-5.1],[3.3,-5.1],[-7.6,-1.5],[7.6,-1.5]];let si=0;
  for(const [id,ch] of P3.chars){let atTable=PL.active&&id===sh&&c&&!c.gone&&(!PL.moving||now-(PL.shotAt||0)<900);
    if(atTable&&id===S.me&&!PL.moving){ch.root.visible=false;charUpdate(ch,dt,now);continue}
    ch.root.visible=true;
    if(atTable){const [X,Z]=W3(c.x,c.y),dx=Math.cos(PL.ang),dz=Math.sin(PL.ang);
      const tx=dx<0?(5.1-X)/-dx:dx>0?(X+5.1)/dx:99,tz=dz<0?(2.6-Z)/-dz:dz>0?(Z+2.6)/dz:99,te=Math.min(tx,tz),d=Math.min(4.4,Math.max(2.9,te+.5));
      ch.root.position.x=X-dx*d+dz*.5;ch.root.position.z=Z-dz*d-dx*.5;ch.root.rotation.y=Math.atan2(dx,dz);
      ch.forced=(PL.strike||PL.moving)?'shoot':'aim'}
    else{const [x,z]=spots[si++%spots.length];ch.root.position.x=x;ch.root.position.z=z;ch.root.rotation.y=Math.atan2(-x,-z*1.4);ch.forced=null;
      if(Math.hypot(P3.cam.position.x-x,P3.cam.position.z-z)<4.2&&P3.cam.position.y<6)ch.root.visible=false}
    charUpdate(ch,dt,now)}}

function p3Render(now){const T=THREE,dt=Math.min(.05,(now-P3.last)/1000);P3.last=now;
  if(P3.rackId!==PL.rackId){P3.meshes.forEach(m=>P3.sc.remove(m));P3.meshes=new Map();P3.rackId=PL.rackId}
  const alive=new Set(PL.balls);
  for(const b of PL.balls){let m=P3.meshes.get(b);
    if(!m){m=new T.Mesh(P3.bg,new T.MeshPhysicalMaterial({map:ballTex(b.n),roughness:.12,clearcoat:1,clearcoatRoughness:.05}));m.castShadow=true;
      m.rotation.set(Math.random()*TAU,Math.random()*TAU,0);P3.sc.add(m);P3.meshes.set(b,m);const [X,Z]=W3(b.x,b.y);m.position.set(X,.12,Z);m.userData={px:b.x,py:b.y}}
    if(b.gone){if(m.visible&&!m.userData.drop)m.userData.drop={t0:now,...p3Near(m)}}
    else{if(!m.visible){m.visible=true;m.userData.drop=null;m.position.y=.12;m.userData.px=b.x;m.userData.py=b.y}
      const dx=b.x-m.userData.px,dy=b.y-m.userData.py,d=Math.hypot(dx,dy);
      if(d>0){m.quaternion.premultiply(new T.Quaternion().setFromAxisAngle(new T.Vector3(dy/d,0,-dx/d),d/100/.12));m.userData.px=b.x;m.userData.py=b.y}
      const [X,Z]=W3(b.x,b.y);m.position.set(X,.12,Z)}}
  P3.meshes.forEach((m,b)=>{if(!alive.has(b)&&m.visible&&!m.userData.drop)m.userData.drop={t0:now,...p3Near(m)};
    const dr=m.userData.drop;if(dr){const t=Math.min(1,(now-dr.t0)/420);m.position.x=dr.x0+(dr.px-dr.x0)*Math.min(1,t*1.6);m.position.z=dr.z0+(dr.pz-dr.z0)*Math.min(1,t*1.6);m.position.y=.12-t*t*.5;
      if(t>=1){m.visible=false;if(!alive.has(b)){P3.sc.remove(m);P3.meshes.delete(b)}}}});
  // taco
  const c=PL.balls[0],cm=c&&P3.meshes.get(c);const showCue=c&&!c.gone&&!PL.moving&&(PL.active||PL.turn==='p');P3.cue.visible=!!showCue;
  if(showCue){let gap=6+PL.pull*95;if(PL.strike){const t=Math.min(1,(now-PL.strike.t0)/110);gap=(6+PL.strike.pw*95)*(1-t*t)}
    const [X,Z]=W3(c.x,c.y),dx=Math.cos(PL.ang),dz=Math.sin(PL.ang),g=(PL.r+3+gap)/100;P3.cue.position.set(X-dx*g,.13+g*.09,Z-dz*g);P3.cue.rotation.set(0,Math.PI-PL.ang,.09)}
  // guía
  const showG=showCue&&PL.active&&PL.turn==='p'&&!PL.strike;[P3.guide,P3.ghost].forEach(o=>o.visible=!!showG);P3.oguide.visible=false;
  if(showG){const gd=plGuide();const [X,Z]=W3(c.x,c.y),[GX,GZ]=W3(gd.gx,gd.gy);const ps=P3.guide.geometry.attributes.position;ps.setXYZ(0,X,.125,Z);ps.setXYZ(1,GX,.125,GZ);ps.needsUpdate=true;P3.guide.computeLineDistances();
    P3.ghost.position.set(GX,.01,GZ);if(gd.hit){const [HX,HZ]=W3(gd.hit.x,gd.hit.y),o=P3.oguide.geometry.attributes.position;o.setXYZ(0,HX,.125,HZ);o.setXYZ(1,HX+gd.nx*.9,.125,HZ+gd.ny*.9);o.needsUpdate=true;P3.oguide.visible=true}}
  P3.target.visible=!!(PL.tp&&PL.active&&!PL.strike&&!PL.moving);
  if(P3.target.visible){const [X,Z]=W3(PL.tp[0],PL.tp[1]);P3.target.position.set(X,.115,Z);P3.target.material.color.set(PL.turn==='p'?'#f2d78c':'#ff6e78');P3.target.material.opacity=.45+.45*Math.sin(now/170)}
  p3Chars(now,dt);p3Camera(dt,false);P3.ren.render(P3.sc,P3.cam)}
function p3Near(m){let best=PL.pockets[0],bd=1e9;for(const p of PL.pockets){const [X,Z]=W3(p[0],p[1]),d=Math.hypot(X-m.position.x,Z-m.position.z);if(d<bd){bd=d;best=p}}const [px,pz]=W3(best[0],best[1]);return{x0:m.position.x,z0:m.position.z,px,pz}}
function plGuide(){const c=PL.balls[0],r=PL.r,{L,T,R,B}=PL,ux=Math.cos(PL.ang),uy=Math.sin(PL.ang);let best=1400,hit=null;
  for(const o of PL.balls){if(o===c||o.gone)continue;const fx=o.x-c.x,fy=o.y-c.y,t=fx*ux+fy*uy;if(t<=0)continue;const q=fx*fx+fy*fy-t*t,rr=4*r*r;if(q>rr)continue;const tt=t-Math.sqrt(rr-q);if(tt<best){best=tt;hit=o}}
  const wx=ux>0?(R-r-c.x)/ux:ux<0?(L+r-c.x)/ux:1e9,wy=uy>0?(B-r-c.y)/uy:uy<0?(T+r-c.y)/uy:1e9;if(!hit)best=Math.min(best,wx,wy);
  const gx=c.x+ux*best,gy=c.y+uy*best;let nx=0,ny=0;if(hit){const ax=hit.x-gx,ay=hit.y-gy,d=Math.hypot(ax,ay)||1;nx=ax/d;ny=ay/d}return{gx,gy,hit,nx,ny}}
