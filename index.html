<title>Casino Sorríos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Limelight&family=Manrope:wght@400;600;700;800&display=swap">
<style>
/* Layout: barra superior fija con saldo y nivel; vestíbulo en rejilla de mesas; cada juego ocupa el escenario central sobre tapete verde. Estética art déco nocturna, tema oscuro único a propósito. */
:root{
  --felt:#0e3a2c; --felt-2:#0a2b21; --night:#070f0d; --gold:#d9b45b; --gold-2:#f2d78c;
  --wine:#7d1f2c; --ivory:#f4ecd8; --muted:#a9b8ad; --line:rgba(217,180,91,.28);
  --red:#b8232f; --black:#151515; --blue:#2a5db0; --green:#1f8a4c;
  --f-display:'Limelight','Didot','Bodoni 72',Georgia,serif;
  --f-body:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--night)}
body{
  color:var(--ivory);font-family:var(--f-body);font-size:15px;line-height:1.45;
  background:radial-gradient(1200px 700px at 50% -10%,#173f33 0,var(--night) 70%) fixed,var(--night);
  min-height:100vh;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 40px;-webkit-tap-highlight-color:transparent;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#081411}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--gold-2);outline-offset:2px}
button:disabled{opacity:.4;cursor:not-allowed}
.num{font-variant-numeric:tabular-nums}

/* Barra superior */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px))) calc(-1*max(16px,env(safe-area-inset-right,0px)));
  padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(#081411f2,#081411e0);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:1100px;margin:auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-family:var(--f-display);font-size:22px;color:var(--gold-2);letter-spacing:.02em;line-height:1;cursor:pointer;white-space:nowrap}
.logo small{display:block;font-family:var(--f-body);font-size:9px;letter-spacing:.35em;color:var(--muted);text-transform:uppercase;margin-top:3px}
.spacer{flex:1}
.bal{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border:1px solid var(--line);border-radius:999px;background:#0006}
.bal .ico{width:26px;height:26px;border-radius:50%;background:repeating-conic-gradient(var(--gold) 0 20deg,#7a5a17 20deg 40deg);box-shadow:inset 0 0 0 5px var(--gold),inset 0 0 0 6px #0005}
.bal b{font-size:17px;color:var(--gold-2)}
.lvl{display:flex;flex-direction:column;gap:3px;min-width:120px;cursor:pointer}
.lvl .t{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.lvl .t b{color:var(--gold-2)}
.bar{height:6px;border-radius:9px;background:#ffffff14;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--gold-2));transition:width .5s}
.tb{padding:8px 12px;border-radius:999px;border:1px solid var(--line);font-size:13px;font-weight:700;position:relative;white-space:nowrap}
.tb:hover{background:#ffffff0d}
.tb .dot{position:absolute;top:2px;right:2px;width:9px;height:9px;border-radius:50%;background:#ff4d5e;box-shadow:0 0 8px #ff4d5e}
@media (max-width:620px){.lvl{order:5;flex-basis:100%}.logo{font-size:18px}.tb{padding:7px 10px;font-size:12px}}

.stage{max-width:1100px;margin:22px auto 0}

/* Vestíbulo */
.btn{padding:11px 18px;border-radius:12px;font-weight:800;letter-spacing:.02em;background:#ffffff10;border:1px solid #ffffff1c;transition:transform .1s,background .2s;color:var(--ivory)}
.btn:hover{background:#ffffff1a}
.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(#f2d78c,#c99a37);color:#2a1a02;border-color:#f6e2a6;box-shadow:0 6px 18px #d9b45b33}
.btn.primary:hover{filter:brightness(1.07)}
.btn.wine{background:linear-gradient(#a12a3a,#6d1824);border-color:#c0475a;color:#fff}
.hall{position:relative;overflow:hidden;border-radius:26px;text-align:center;border:1px solid #d9b45b66;
  background:radial-gradient(ellipse 80% 70% at 50% 0%,#5a1a28 0,#2a0a12 45%,#0b0507 100%);box-shadow:0 30px 60px #000a,inset 0 0 80px #000}
.rays{position:absolute;left:50%;top:-30%;width:1600px;height:1600px;margin-left:-800px;background:repeating-conic-gradient(#d9b45b12 0 5deg,transparent 5deg 10deg);
  -webkit-mask:radial-gradient(circle,#000 0,transparent 60%);mask:radial-gradient(circle,#000 0,transparent 60%);animation:spin 160s linear infinite;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
.bokeh{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.bulbs-row{position:absolute;left:14px;right:14px;height:12px;background:radial-gradient(circle,#fff3c4 0 3px,#f2d78c66 4px,transparent 6px) 0 50%/24px 12px repeat-x;animation:chase .9s steps(2) infinite;filter:drop-shadow(0 0 4px #f2d78c)}
.bulbs-row.top{top:10px}.bulbs-row.bot{bottom:10px}
@keyframes chase{to{background-position:12px 50%}}
.hall-in{position:relative;padding:clamp(40px,8vw,84px) 12px clamp(40px,7vw,72px);max-width:980px;margin:auto}
.eyebrow{font-size:11px;letter-spacing:.35em;text-transform:uppercase;color:var(--gold)}
.hall h1{margin:6px 0 0;font-weight:400;line-height:.95}
.gc-small{display:block;font-family:var(--f-display);font-size:clamp(18px,3.5vw,28px);letter-spacing:.3em;color:var(--ivory);text-transform:uppercase}
.gold-title{display:block;font-family:var(--f-display);font-size:clamp(46px,11.5vw,116px);letter-spacing:.01em;padding:0 .08em;
  background:linear-gradient(100deg,#9a6c22 0%,#f2d78c 25%,#fff7dc 38%,#d9b45b 50%,#9a6c22 70%,#f2d78c 85%,#fff7dc 100%);background-size:220% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 7s linear infinite;filter:drop-shadow(0 6px 18px #000)}
@keyframes shine{to{background-position:-220% 0}}
.lead{color:#e9dcc0;font-size:clamp(15px,2.2vw,18px);max-width:46ch;margin:18px auto 22px;text-wrap:balance}
.purse{display:inline-flex;align-items:center;gap:12px;padding:10px 22px 10px 12px;border-radius:999px;background:#000a;border:1px solid var(--gold);margin-bottom:22px;text-align:left}
.purse .ico{width:40px;height:40px;border-radius:50%;background:repeating-conic-gradient(var(--gold) 0 20deg,#7a5a17 20deg 40deg);box-shadow:inset 0 0 0 7px var(--gold),inset 0 0 0 8px #0005}
.purse small{display:block;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.purse b{font-size:26px;color:var(--gold-2)}
.btn.big{padding:15px 26px;font-size:16px;border-radius:14px;text-decoration:none;display:inline-block}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}
@media (max-width:760px){.how{grid-template-columns:1fr}}
.step{display:flex;gap:14px;align-items:flex-start;padding:16px;border-radius:16px;background:#0d1a16;border:1px solid #ffffff12}
.sn{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:20px;color:#2a1a02;background:linear-gradient(#f2d78c,#c99a37)}
.step b{font-size:16px}.step p{margin:3px 0 0;color:var(--muted);font-size:13px}
.duo{display:grid;grid-template-columns:1.2fr 1fr;gap:14px;margin-bottom:8px}
@media (max-width:760px){.duo{grid-template-columns:1fr}}
.jp-panel{border-radius:18px;padding:22px;text-align:center;background:linear-gradient(#1a0509,#0b0204);border:2px solid var(--gold);box-shadow:inset 0 0 40px #000,0 0 30px #d9b45b22}
.jp-panel p{color:var(--muted);margin:8px auto 14px;max-width:40ch;font-size:14px}
.led{font-family:'Courier New',monospace;font-weight:700;font-size:clamp(34px,7vw,56px);color:#ffcf5a;letter-spacing:.06em;margin-top:8px;padding:6px 14px;border-radius:10px;background:#000;display:inline-block;
  text-shadow:0 0 8px #ffb300,0 0 22px #ff8a00;box-shadow:inset 0 0 0 1px #ffffff14}
.member{text-align:left;border-radius:20px;padding:20px;color:var(--ivory);display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden;
  background:linear-gradient(135deg,#16120c,#050505 60%,#1b150b);border:1px solid #d9b45b88;box-shadow:0 20px 40px #000a;transition:transform .2s}
.member:hover{transform:translateY(-2px)}
.member::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,#ffffff12 45%,transparent 60%);pointer-events:none}
.m-top{display:flex;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.m-chip{width:36px;height:26px;border-radius:5px;background:linear-gradient(135deg,#f2d78c,#a07a2c);box-shadow:inset 0 0 0 1px #0004}
.m-tier{font-family:var(--f-display);font-size:30px;color:var(--gold-2);margin-top:6px}
.m-lv{font-size:14px;color:var(--muted)}
.m-txt{font-size:13px;color:#d9d0bc}.m-txt b{color:var(--gold-2)}
.m-foot{display:flex;justify-content:space-between;font-size:12px;color:var(--gold);margin-top:4px}
.room-t{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:30px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.room-t h2{font-family:var(--f-display);font-weight:400;font-size:28px;margin:0;color:var(--gold-2)}
.room-t span{color:var(--muted);font-size:13px}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.gc{text-align:left;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:#0c1613;display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s}
.gc:hover{transform:translateY(-4px);box-shadow:0 18px 34px #000a,0 0 0 1px var(--gold)}
.gc .art{height:160px;position:relative;display:grid;place-items:center;overflow:hidden;border-bottom:3px solid #3b2413;box-shadow:inset 0 0 40px #0009}
.felt{background:radial-gradient(ellipse at 50% 30%,#1f7a5a,#0d3f2d 75%)}
.felt-red{background:radial-gradient(ellipse at 50% 30%,#3a1a10,#140806 75%)}
.felt-blue{background:radial-gradient(ellipse at 50% 30%,#1f3f7a,#0c1a3a 75%)}
.felt-wine{background:radial-gradient(ellipse at 50% 30%,#8a2333,#2b0810 75%)}
.felt-navy{background:radial-gradient(ellipse at 50% 30%,#22306a,#0a0f2a 75%)}
.felt-wood{background:radial-gradient(ellipse at 50% 30%,#7a4a1c,#2b170a 75%)}
.gc .art .tag{position:absolute;top:10px;left:10px;font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;padding:4px 8px;border-radius:99px;background:#000b;color:var(--gold-2)}
.gc .bd{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.gc h3{margin:0;font-size:18px}
.gc p{margin:0;color:#c7d0c9;font-size:14px;flex:1}
.gc .meta{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
.gc .meta span:last-child{color:var(--gold)}
.gc .play{margin-top:6px;text-align:center;padding:9px;border-radius:10px;font-weight:800;font-size:14px;background:linear-gradient(#f2d78c,#c99a37);color:#2a1a02}
.mini-wheel{width:150px;height:150px;filter:drop-shadow(0 8px 12px #000c)}
.fan{display:flex;font-size:11px}
.fan .card{transform-origin:50% 120%}
.fan .card:nth-child(1){transform:rotate(-10deg)}.fan .card:nth-child(2){transform:rotate(8deg) translateY(-4px);margin-left:-1.4em}
.fan.wide{font-size:9.5px}.fan.wide .card{margin-left:-2.2em!important}
.fan.wide .card:nth-child(1){transform:rotate(-20deg);margin-left:0!important}.fan.wide .card:nth-child(2){transform:rotate(-10deg) translateY(-5px)}.fan.wide .card:nth-child(3){transform:translateY(-7px)}.fan.wide .card:nth-child(4){transform:rotate(10deg) translateY(-5px)}.fan.wide .card:nth-child(5){transform:rotate(20deg)}
.stack{position:absolute;right:28px;bottom:22px;display:flex;flex-direction:column-reverse}
.stack b{width:38px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 2px 0 #0008,inset 0 0 0 2px #fff6;margin-top:-4px}
.badge9{position:absolute;bottom:14px;right:14px;font-family:var(--f-display);color:var(--gold-2);font-size:18px}
.mini-dice{display:flex;gap:14px}.mini-dice .die{width:58px;height:58px;padding:8px}.mini-dice .die i{width:10px;height:10px;visibility:hidden}
.mini-dice .die:first-child{transform:rotate(-14deg)}.mini-dice .die:last-child{transform:rotate(11deg) translateY(8px)}
.mini-reels{display:flex;gap:6px;padding:8px;border-radius:12px;background:#0b0306;border:2px solid var(--gold);box-shadow:0 0 24px #f2d78c55}
.mini-reels span{width:52px;height:68px;display:grid;place-items:center;font-size:48px;border-radius:6px;background:linear-gradient(#e9e2cf,#fffdf5 40%,#d9d0b8);animation:glow7 1.4s ease-in-out infinite alternate}
@keyframes glow7{to{box-shadow:inset 0 0 0 3px #f2d78c,0 0 12px #f2d78c}}
.mini-keno{display:grid;grid-template-columns:repeat(8,22px);gap:4px}
.mini-keno i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:9px;font-weight:800;background:#f4ecd8;color:#222}
.mini-keno i.on{background:#b3202c;color:#fff;box-shadow:0 0 8px #ff5a6a}
.mini-rack{display:flex;align-items:center;gap:0;margin-left:110px}
.mini-rack div{display:flex;flex-direction:column;margin-left:-3px}
.mini-rack i{width:24px;height:24px;border-radius:50%;margin:0;display:grid;place-items:center;font-style:normal;font-size:9px;font-weight:800;color:#111;
  background:radial-gradient(circle at 35% 30%,#fff9 0 10%,transparent 30%),radial-gradient(circle,#fff 0 30%,var(--b) 32%);box-shadow:0 3px 4px #0008}
.mini-rack i.st{background:radial-gradient(circle at 35% 30%,#fff9 0 10%,transparent 30%),radial-gradient(circle,#fff 0 30%,transparent 32%),linear-gradient(#f4ecd8 0 22%,var(--b) 22% 78%,#f4ecd8 78%)}
.mini-cue{position:absolute;left:-10px;top:50%;width:36%;height:7px;border-radius:4px;transform:rotate(-4deg);background:linear-gradient(90deg,#2b1208 0 35%,#1a1a1a 35% 48%,#d9b47a 48% 96%,#f4ecd8 96% 98%,#3d7fd6 98%);box-shadow:4px 8px 6px #0006}
.mini-cue::after{content:"";position:absolute;right:-30px;top:-8px;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 20%,#ddd 60%,#aaa)}
.disc{margin-top:30px;color:#7d8c83;font-size:12px;text-align:center}


/* Fachada */
body.facade-mode{padding-bottom:0;overflow:hidden}
body.facade-mode .stage{margin-top:12px}
.facade{position:relative;overflow:hidden;border-radius:22px;border:1px solid #d9b45b55;
  background:radial-gradient(1.2px 1.2px at 12% 18%,#fff,transparent),radial-gradient(1px 1px at 28% 8%,#fff,transparent),radial-gradient(1.4px 1.4px at 44% 22%,#fffbe0,transparent),radial-gradient(1px 1px at 63% 12%,#fff,transparent),radial-gradient(1.2px 1.2px at 78% 26%,#fff,transparent),radial-gradient(1px 1px at 90% 9%,#fff,transparent),radial-gradient(1px 1px at 6% 40%,#fff,transparent),radial-gradient(1px 1px at 95% 38%,#fff,transparent),radial-gradient(1.2px 1.2px at 35% 34%,#fff,transparent),radial-gradient(1px 1px at 55% 4%,#fff,transparent),
  linear-gradient(#040714 0%,#0d0b26 45%,#2a1030 75%,#4a1a2a 100%)}
.bld{position:absolute;inset:0;width:100%;height:100%;overflow:visible;transition:transform .8s cubic-bezier(.5,0,.8,.4),opacity .8s}
.facade.zoom .bld{transform:scale(5);opacity:0}
.facade.zoom::after{content:"";position:absolute;inset:0;background:#fff3d6;animation:fadein .8s .15s both}
@keyframes fadein{from{opacity:0}}
.moon{position:absolute;top:7%;right:9%;width:clamp(36px,6vw,64px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fffbe8,#e8dcb8);box-shadow:0 0 40px 10px #fff3c433}
.beam{position:absolute;bottom:18%;width:90px;height:120%;transform-origin:50% 100%;background:linear-gradient(to top,#fff6d855,transparent 85%);clip-path:polygon(44% 100%,56% 100%,100% 0,0 0);filter:blur(2px);pointer-events:none}
.beam.b1{left:22%;animation:sweep 7s ease-in-out infinite alternate}
.beam.b2{right:22%;animation:sweep 8s ease-in-out -3s infinite alternate-reverse}
@keyframes sweep{from{transform:rotate(-28deg)}to{transform:rotate(24deg)}}
.sign-t{font-family:'Limelight',Georgia,serif;font-size:50px;fill:url(#gold)}
.canopy-t{font-family:'Manrope',sans-serif;font-weight:800;font-size:17px;letter-spacing:.16em;fill:#fff3d6}
.sb{fill:#fff3c4}.sb.a{animation:bulb 1s steps(1) infinite}.sb.b{animation:bulb 1s steps(1) -.5s infinite}
@keyframes bulb{50%{fill:#7a5a17}}
.win{fill:#2a2030}.win.lit{fill:#f2c46b;opacity:.85}.win.fl{animation:flick 4s infinite}
@keyframes flick{0%,100%{opacity:.85}48%{opacity:.85}50%{opacity:.35}53%{opacity:.85}}
.beacon{fill:#ff3b4e;animation:bulb 1.6s steps(1) infinite}
.door{cursor:pointer;outline:none}
.door-ring{animation:ring 1.6s ease-in-out infinite;filter:drop-shadow(0 0 6px #f2d78c)}
@keyframes ring{50%{stroke-opacity:.2}}
.door:hover .door-ring,.door:focus-visible .door-ring{stroke:#fff;stroke-width:5}
.leafL,.leafR{transform-box:fill-box;transition:transform .6s cubic-bezier(.3,.7,.3,1)}
.leafL{transform-origin:0 50%}.leafR{transform-origin:100% 50%}
.door.open .leafL,.door.open .leafR{transform:scaleX(.08)}
.hint{position:absolute;left:50%;bottom:max(10px,2%);transform:translateX(-50%);padding:8px 16px;border-radius:99px;background:#000b;border:1px solid var(--gold);color:var(--gold-2);font-weight:800;font-size:14px;white-space:nowrap;animation:hint 1.6s ease-in-out infinite;pointer-events:none}
@keyframes hint{50%{transform:translate(-50%,-4px)}}
@media (max-width:600px){.hint{bottom:auto;top:14px}}
/* Salón */
.salon-h{text-align:center;padding:10px 0 6px}
.salon-h h2{font-family:var(--f-display);font-weight:400;font-size:clamp(34px,6vw,52px);margin:4px 0;color:var(--gold-2)}
.salon-h p{color:var(--muted);margin:0 auto 14px;max-width:52ch}
.strip{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:stretch}
.s-jp,.s-mem{display:flex;flex-direction:column;justify-content:center;gap:2px;padding:8px 14px;border-radius:14px;background:#0b0204;border:1px solid var(--gold);text-align:center}
.s-jp small,.s-mem small{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
.s-jp .led{font-size:24px;margin:0;padding:2px 10px}
.s-mem{background:linear-gradient(135deg,#16120c,#050505);color:var(--ivory)}.s-mem span{font-size:13px}
.room-list{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
@media (max-width:900px){.room-list{grid-template-columns:1fr}}
.rrow{display:grid;grid-template-columns:128px 1fr;grid-template-rows:auto auto;gap:10px 14px;align-items:center;padding:12px;border-radius:18px;background:#0c1613;border:1px solid var(--line)}
.rrow:hover{box-shadow:0 0 0 1px var(--gold)}
.thumb{grid-row:1/3;width:128px;height:112px;border-radius:12px;overflow:hidden;position:relative;box-shadow:inset 0 0 30px #000a;border:2px solid #3b2413}
.thumb .in{position:absolute;left:50%;top:50%;width:230px;height:170px;margin:-85px 0 0 -115px;transform:scale(.6);display:grid;place-items:center}
.rinfo{min-width:0}.rinfo h3{margin:0;font-size:18px}.rinfo p{margin:2px 0 4px;color:#c7d0c9;font-size:13.5px}
.rinfo .meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted)}.rinfo .meta span:last-child{color:var(--gold)}
.enter{grid-column:2;letter-spacing:.08em;font-size:14px;padding:12px}
@media (max-width:480px){.rrow{grid-template-columns:96px 1fr}.thumb{width:96px;height:96px;grid-row:1}.thumb .in{transform:scale(.45)}.enter{grid-column:1/-1}}
/* Cabecera de juego */
.gh{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.back{padding:8px 14px;border-radius:999px;border:1px solid var(--line);font-weight:700;font-size:13px}

let AC=null;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return null}}if(AC.state==='suspended')AC.resume();return AC}
function tone(f,d,type='sine',v=.12,when=0){const a=ac();if(!a||!S.sound)return;const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;const t=a.currentTime+when;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.05)}
function noise(d,when=0,freq=1800,v=.18){const a=ac();if(!a||!S.sound)return;const b=a.createBuffer(1,Math.max(1,a.sampleRate*d|0),a.sampleRate),x=b.getChannelData(0);for(let i=0;i<x.length;i++)x[i]=(Math.random()*2-1)*(1-i/x.length);const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=freq;const g=a.createGain();g.gain.value=v;s.connect(f).connect(g).connect(a.destination);s.start(a.currentTime+when)}
const SFX={
  click:()=>tone(880,.05,'square',.04),
  chip:()=>{tone(2400,.04,'triangle',.07);tone(3300,.04,'triangle',.05,.025)},
  card:()=>noise(.07,0,2500,.2),
  win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.28,'triangle',.11,i*.08)),
  big:()=>{[523,659,784,1047,1319,1568].forEach((f,i)=>tone(f,.5,'triangle',.13,i*.09));for(let i=0;i<14;i++)tone(2000+rnd(1500),.08,'sine',.05,.5+i*.07)},
  lose:()=>{tone(330,.18,'sine',.07);tone(247,.3,'sine',.07,.15)},
  err:()=>tone(150,.2,'sawtooth',.06),
  tick:()=>tone(1700,.015,'square',.025),
  stop:()=>{noise(.05,0,600,.25);tone(180,.08,'sine',.08)},
  dice:()=>{for(let i=0;i<7;i++)noise(.03,i*.06,900,.25)},
  level:()=>[392,523,659,784,1047].forEach((f,i)=>tone(f,.35,'square',.06,i*.1)),
};

/* ---------- HUD ---------- */
let shown=S.chips;
function hud(){
  const el=$('#hChips'),from=shown,to=S.chips,t0=performance.now();shown=to;
  const step=now=>{const t=Math.min(1,(now-t0)/450);el.textContent=fmt(from+(to-from)*(1-Math.pow(1-t,3)));if(t<1)requestAnimationFrame(step)};requestAnimationFrame(step);
  $('#hLvl').textContent=S.level;$('#hTier').textContent=tier()[1];
  $('#hXp').textContent=fmt(S.xp)+' / '+fmt(need(S.level))+' puntos';
  $('#hBar').style.width=Math.min(100,S.xp/need(S.level)*100)+'%';
  $('#sndBtn').textContent='Sonido: '+(S.sound?'sí':'no');
  bonusTimer();
}
const BONUS_MS=4*3600e3;
function bonusTimer(){const left=S.lastBonus+BONUS_MS-Date.now();const b=$('#bonusT');
  if(left<=0){b.innerHTML='<span class="dot"></span>';b.textContent='';b.insertAdjacentHTML('beforeend','<span class="dot"></span>')}
  else{const h=Math.floor(left/3600e3),m=Math.floor(left%3600e3/60e3);b.textContent=`${h}h ${String(m).padStart(2,'0')}m`}}
setInterval(bonusTimer,30000);

function toast(t,cls=''){const d=document.createElement('div');d.className='toast '+cls;d.textContent=t;$('#toasts').appendChild(d);setTimeout(()=>d.remove(),3200)}
function modal(html,onMount){const r=$('#modalRoot');r.innerHTML=`<div class="ov"><div class="modal" role="dialog">${html}</div></div>`;const ov=r.firstChild;ov.addEventListener('click',e=>{if(e.target===ov||e.target.closest('[data-close]'))closeModal()});onMount&&onMount(ov);}
function closeModal(){$('#modalRoot').innerHTML=''}

/* ---------- Economía ---------- */
function take(a){if(a>S.chips){toast('Saldo insuficiente para esa apuesta');sfx('err');return false}S.chips-=a;hud();save();return true}
function give(a){S.chips+=a;hud();save()}
function addXP(bet){S.xp+=Math.ceil(bet/10);let up=false;
  while(S.xp>=need(S.level)){S.xp-=need(S.level);S.level++;up=true;const reward=1000*S.level;S.chips+=reward;
    setTimeout(()=>{sfx('level');toast(`Subes al nivel ${S.level} · +${fmt(reward)} fichas`,'gold')},400);
    if(S.level>=5)ach('lvl5');if(S.level>=10)ach('lvl10');if(S.level>=20)ach('lvl20');}
  return up}
function settle(game,bet,ret,ref){
  ref=ref||bet;S.chips+=ret;S.stats.rounds++;S.stats.wagered+=bet;S.stats.won+=ret;S.played[game]=1;
  const net=ret-bet;if(net>0){S.stats.wins++;ach('first')}
  if(net>S.stats.biggest)S.stats.biggest=net;
  if(bet>0)addXP(bet);
  if(net>=50000)ach('big50');if(S.stats.wagered>=100000)ach('high');if(S.stats.wagered>=1000000)ach('whale');
  if(Object.keys(S.played).length>=7)ach('all');
  if(net>0&&((net>=ref*10&&net>=1000)||net>=25000))bigWin(net,ref);else if(net>0)sfx('win');else if(ret===0&&bet>0)sfx('lose');
  hud();save();setTimeout(checkBroke,1200);
}
function checkBroke(){if(S.chips<10&&!$('#modalRoot').innerHTML&&$('#bigwin').hidden){
  modal(`<h3>La casa invita</h3><p>Te has quedado sin fichas. El jefe de sala te ofrece 2.500 fichas de cortesía para seguir jugando.</p><div class="row-c"><button class="btn primary" id="rescue">Aceptar 2.500 fichas</button></div>`,ov=>{$('#rescue',ov).onclick=()=>{give(2500);closeModal();sfx('win')}})}}

/* ---------- Gran premio ---------- */
let bwRaf=0;
function bigWin(net,ref){
  sfx('big');const o=$('#bigwin');o.hidden=false;const x=net/(ref||1);
  $('#bwT').textContent=x>=100?'MEGA PREMIO':x>=30?'SÚPER PREMIO':'GRAN PREMIO';
  const n=$('#bwN'),t0=performance.now();
  const cv=$('#coins'),c=cv.getContext('2d');cv.width=innerWidth;cv.height=innerHeight;
  const P=Array.from({length:110},()=>({x:Math.random()*cv.width,y:-Math.random()*cv.height,v:2+Math.random()*5,s:8+Math.random()*12,a:Math.random()*TAU,w:.05+Math.random()*.15}));
  cancelAnimationFrame(bwRaf);
  const f=now=>{const t=Math.min(1,(now-t0)/1800);n.textContent='+'+fmt(net*(1-Math.pow(1-t,3)));
    c.clearRect(0,0,cv.width,cv.height);
    for(const p of P){p.y+=p.v;p.a+=p.w;if(p.y>cv.height+20){p.y=-20;p.x=Math.random()*cv.width}
      const sx=Math.abs(Math.cos(p.a));c.beginPath();c.ellipse(p.x,p.y,p.s*sx+1,p.s,0,0,TAU);
      const g=c.createLinearGradient(p.x-p.s,p.y,p.x+p.s,p.y);g.addColorStop(0,'#7a5a17');g.addColorStop(.5,'#f2d78c');g.addColorStop(1,'#c28a12');c.fillStyle=g;c.fill()}
    if(!o.hidden)bwRaf=requestAnimationFrame(f)};
  bwRaf=requestAnimationFrame(f);
  clearTimeout(bigWin.t);bigWin.t=setTimeout(closeBig,5000);
}
function closeBig(){$('#bigwin').hidden=true;cancelAnimationFrame(bwRaf);checkBroke()}
$('#bwOk').onclick=closeBig;

const roTotal=()=>Object.values(RO.bets).reduce((a,b)=>a+b,0);
function roMarks(){$$('#roBoard [data-k]').forEach(c=>{const v=RO.bets[c.dataset.k],m=c.querySelector('.mk');m.hidden=!v;if(v)m.textContent=short(v)});const t=$('#roTot');if(t)t.textContent=fmt(roTotal())}
function roHist(){const h=$('#roHist');if(h)h.innerHTML=RO.hist.slice(0,14).map(n=>`<span class="${roColor(n)}">${n}</span>`).join('')}
function roPay(k,n){if(k[0]==='n')return +k.slice(1)===n?36:0;if(n===0)return 0;
  switch(k){case'red':return RO.red.has(n)?2:0;case'black':return RO.red.has(n)?0:2;case'even':return n%2===0?2:0;case'odd':return n%2?2:0;
  case'low':return n<=18?2:0;case'high':return n>=19?2:0;case'd1':return n<=12?3:0;case'd2':return n>12&&n<=24?3:0;case'd3':return n>24?3:0;
  case'c1':return n%3===1?3:0;case'c2':return n%3===2?3:0;case'c3':return n%3===0?3:0}return 0}
function drawWheel(rot,ball,cv){
  cv=cv||$('#roC');if(!cv)return;const x=cv.getContext('2d'),W=cv.width,R=W/2,seg=TAU/37,off=-Math.PI/2;
  x.clearRect(0,0,W,W);x.save();x.translate(R,R);
  let g=x.createRadialGradient(0,0,R*.8,0,0,R);g.addColorStop(0,'#5a3418');g.addColorStop(.6,'#3b2413');g.addColorStop(1,'#1c0f06');

    x.fillStyle=n===0?'#17703d':RO.red.has(n)?'#a81e2a':'#141414';x.fill();x.strokeStyle='#d9b45b';x.lineWidth=1.5;x.stroke();
    x.save();x.rotate(a0+seg/2);x.translate(R*.77,0);x.rotate(Math.PI/2);x.fillStyle='#f4ecd8';x.font=`700 ${R*.058}px Manrope,sans-serif`;x.textAlign='center';x.textBaseline='middle';x.fillText(n,0,0);x.restore()}
  g=x.createRadialGradient(-R*.1,-R*.1,R*.05,0,0,R*.6);g.addColorStop(0,'#8a5a2b');g.addColorStop(1,'#3b2413');
  x.beginPath();x.arc(0,0,R*.6,0,TAU);x.fillStyle=g;x.fill();x.strokeStyle='#d9b45b';x.lineWidth=3;x.stroke();
  x.save();x.rotate(rot);x.fillStyle='#e8c66e';for(let k=0;k<4;k++){x.rotate(Math.PI/2);x.fillRect(-R*.018,-R*.32,R*.036,R*.26);x.beginPath();x.arc(0,-R*.33,R*.035,0,TAU);x.fill()}x.restore();
  g=x.createRadialGradient(-R*.03,-R*.03,2,0,0,R*.11);g.addColorStop(0,'#fff2c4');g.addColorStop(1,'#b98a2e');x.beginPath();x.arc(0,0,R*.1,0,TAU);x.fillStyle=g;x.fill();
  if(ball){const a=off+ball.a,br=ball.r*R;g=x.createRadialGradient(Math.cos(a)*br-3,Math.sin(a)*br-3,1,Math.cos(a)*br,Math.sin(a)*br,R*.03);g.addColorStop(0,'#fff');g.addColorStop(1,'#bdbdbd');
    x.beginPath();x.arc(Math.cos(a)*br,Math.sin(a)*br,R*.028,0,TAU);x.fillStyle=g;x.fill()}
  x.restore();
}
function roAnimate(idx){return new Promise(res=>{
  const seg=TAU/37,r0=RO.rot,target=((-(idx*seg+seg/2))%TAU+TAU)%TAU,cur=((r0%TAU)+TAU)%TAU,delta=(target-cur+TAU)%TAU,r1=r0+TAU*3+delta,B=-TAU*8,T=6200,t0=performance.now();let lastP=-1;
  const f=now=>{const t=Math.min(1,(now-t0)/T),e=1-Math.pow(1-t,3),rot=r0+(r1-r0)*e,ba=B*(1-(1-Math.pow(1-t,2.4)));
    let br=t<.55?.875:.875-(.875-.72)*Math.min(1,(t-.55)/.25);if(t>.55&&t<.85)br+=Math.abs(Math.sin((t-.55)*38))*.04*(1-(t-.55)/.3);
    let a=ba;if(t>.78){const pa=rot+idx*seg+seg/2;let d=((pa-ba)%TAU+TAU)%TAU;if(d>Math.PI)d-=TAU;const s=Math.min(1,(t-.78)/.22);a=ba+d*(s*s*(3-2*s))}
    const p=Math.floor((a-rot)/seg);if(p!==lastP&&t>.5){sfx('tick');lastP=p}
    drawWheel(rot,{a,r:br});
    if(t<1)requestAnimationFrame(f);else{RO.rot=r1%TAU;RO.ball={a:RO.rot+idx*seg+seg/2,r:.72};drawWheel(RO.rot,RO.ball);res()}};
  requestAnimationFrame(f)})}

async function bjDeal(){

    if(p&&d){ret=h.bet;h.res=['Empate','#f2d78c'];setMsg('#bjMsg','Los dos tenéis blackjack. Empate')}

async function bjHit(){if(bjBusy)return;bjBusy=true;const h=BJ.hands[BJ.act];h.cards.push(bjDraw());sfx('card');bjRender();const v=bjVal(h.cards).t;

async function bjDouble(){if(bjBusy)return;const h=BJ.hands[BJ.act];if(!take(h.bet))return;bjBusy=true;h.bet*=2;h.cards.push(bjDraw());sfx('card');h.done=1;
  if(bjVal(h.cards).t>21)h.res=['Te pasas','#ffb3b3'];bjRender();await sleep(500);await bjNext();bjBusy=false}

  const nh={cards:[h.cards.pop()],bet:h.bet};BJ.hands.splice(BJ.act+1,0,nh);const aces=h.cards[0].i===0;
  h.cards.push(bjDraw());bjRender();await sleep(300);nh.cards.push(bjDraw());sfx('card');
  if(aces){h.done=1;nh.done=1;bjRender();await sleep(400);await bjNext()}else{if(bjVal(h.cards).t===21){h.done=1;await bjNext()}else bjRender()}bjBusy=false}
async function bjNext(){const i=BJ.hands.findIndex(h=>!h.done);if(i>=0){BJ.act=i;const h=BJ.hands[i];if(h.cards.length<2){h.cards.push(bjDraw());sfx('card')}if(bjVal(h.cards).t===21){h.done=1;bjRender();await sleep(300);return bjNext()}bjRender();return}
  BJ.phase='dealer';bjRender();await sleep(400);BJ.hide=false;BJ.dealer[1].f=1;BJ.dealer[1].n=0;sfx('card');bjRender();
  const live=BJ.hands.some(h=>bjVal(h.cards).t<=21);

  bjEnd(bet,ret);
}
